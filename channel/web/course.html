<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课程 · Walle</title>
  <link rel="stylesheet" href="/static/katex/katex.min.css">
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --panel2: #1c2330;
      --border: #2c3644; --border-strong: #3d4b5f;
      --text: #e6edf3; --muted: #8b98a8; --faint: #66717f;
      --accent: #2f81f7; --accent-soft: #173a63; --warn: #d29922;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: radial-gradient(1100px 500px at 15% -10%, #17233a 0%, transparent 60%), var(--bg);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 12px 20px; background: #121821ee; border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    .brand { min-width: 0; }
    h1 { margin: 0; font-size: 17px; line-height: 1.35; }
    .brand small { color: var(--faint); font-size: 11px; }
    .head-links { display: flex; gap: 14px; flex: 0 0 auto; font-size: 12px; }
    a { color: #79b8ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .layout {
      display: flex; gap: 14px; max-width: 1620px; margin: 0 auto;
      padding: 14px 20px 36px; align-items: stretch;
    }
    .sidebar {
      flex: 0 0 280px; align-self: flex-start; position: sticky; top: 78px;
      max-height: calc(100vh - 96px); overflow-y: auto; padding: 14px;
      background: var(--panel); border: 1px solid var(--border-strong);
      border-radius: 12px;
    }
    .course-goal {
      margin-bottom: 14px; color: var(--muted); font-size: 12px; line-height: 1.7;
      white-space: pre-wrap;
    }
    .nav-head {
      margin: 4px 0 8px; color: var(--faint); font-size: 11px; letter-spacing: .4px;
    }
    .lesson-nav { display: flex; flex-direction: column; gap: 5px; }
    .lesson-link {
      display: flex; gap: 8px; width: 100%; padding: 8px 9px; text-align: left;
      border: 1px solid transparent; border-radius: 8px; background: transparent;
      color: var(--muted); font-size: 12px; line-height: 1.5; cursor: pointer;
    }
    .lesson-link:hover { background: var(--panel2); color: var(--text); }
    .lesson-link.active {
      background: var(--accent-soft); border-color: #24507f; color: #dbeaff;
    }
    .lesson-index {
      flex: 0 0 auto; width: 20px; color: var(--faint);
      font-family: var(--mono); font-size: 11px; text-align: right;
    }
    .reader {
      flex: 1 1 auto; min-width: 0; min-height: calc(100vh - 96px);
      display: flex; flex-direction: column; padding: 20px 24px;
      background: var(--panel); border: 1px solid var(--border-strong);
      border-radius: 12px;
    }
    #content { flex: 1 0 auto; }
    .reader-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
    .reader-head h2 { margin: 0; font-size: 21px; line-height: 1.4; }
    .reader-head span { color: var(--faint); font-size: 11px; }
    .md { font-size: 14px; line-height: 1.8; word-break: break-word; }
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md h1, .md h2, .md h3, .md h4 { margin: 20px 0 8px; line-height: 1.35; }
    .md h1 { font-size: 1.5em; }
    .md h2 { font-size: 1.3em; }
    .md h3 { font-size: 1.12em; }
    .md p { margin: 9px 0; }
    .md ul, .md ol { margin: 8px 0; padding-left: 24px; }
    .md li { margin: 3px 0; }
    .md code {
      font-family: var(--mono); font-size: .9em; padding: 1px 5px;
      border-radius: 5px; background: #0b0f14; border: 1px solid var(--border);
    }
    .md pre {
      margin: 10px 0; padding: 11px 13px; border-radius: 8px; overflow-x: auto;
      background: #0b0f14; border: 1px solid var(--border);
    }
    .md pre code { padding: 0; border: 0; background: none; font-size: 12px; line-height: 1.6; }
    .md blockquote {
      margin: 10px 0; padding: 2px 12px; color: var(--muted);
      border-left: 3px solid var(--border-strong);
    }
    .md table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
    .md th, .md td { padding: 6px 8px; border: 1px solid var(--border); text-align: left; }
    .md th { background: var(--panel2); }
    .md a { color: #79b8ff; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
    .canvas-embed {
      display: block; width: 100%; height: 460px; margin: 14px 0;
      border: 1px solid var(--border-strong); border-radius: 10px; background: #fff;
    }
    .lesson-actions { display: flex; justify-content: space-between; margin-top: 24px; gap: 10px; }
    .lesson-actions button {
      padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel2); color: var(--text); font-size: 12px; cursor: pointer;
    }
    .lesson-actions button:disabled { color: var(--faint); cursor: default; }
    .empty { padding: 36px 12px; text-align: center; color: var(--muted); line-height: 1.8; }
    .empty strong { display: block; color: var(--text); margin-bottom: 6px; }

    /* ── 课程答疑 ───────────────────────────────── */
    .qa {
      flex: 0 0 350px; position: sticky; top: 78px; height: calc(100vh - 96px);
      display: flex; flex-direction: column; overflow: hidden;
      background: var(--panel); border: 1px solid var(--border-strong);
      border-radius: 12px;
    }
    .qa-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    .qa-head strong { font-size: 13px; }
    .qa-sub {
      margin-top: 3px; max-width: 210px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; color: var(--faint); font-size: 11px;
    }
    .qa-status { flex: 0 0 auto; color: var(--faint); font-size: 11px; white-space: nowrap; }
    .qa-status.on { color: var(--ok); }
    .qa-status.off { color: var(--danger); }
    .qa-log {
      flex: 1; min-height: 0; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 9px;
    }
    .qa-empty { margin: auto; padding: 12px; color: var(--muted); font-size: 12px; line-height: 1.7; text-align: center; }
    .qa-msg {
      max-width: 94%; padding: 8px 10px; border-radius: 10px;
      font-size: 13px; line-height: 1.65; word-break: break-word;
      white-space: pre-wrap;
    }
    .qa-msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
    .qa-msg.assistant { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); }
    .qa-msg.assistant.md { white-space: normal; }
    .qa-note { align-self: center; color: var(--faint); font-size: 11px; text-align: center; }
    .qa-compose {
      display: flex; flex-direction: column; gap: 6px; padding: 10px;
      border-top: 1px solid var(--border);
    }
    .qa-compose textarea {
      resize: none; min-height: 44px; max-height: 110px; padding: 8px 9px;
      border-radius: 8px; border: 1px solid var(--border); background: #0b0f14;
      color: var(--text); font: inherit; font-size: 12px; line-height: 1.5;
    }
    .qa-actions { display: flex; justify-content: flex-end; gap: 6px; }
    .qa-actions button {
      padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--panel2); color: var(--text); font-size: 12px; cursor: pointer;
    }
    .qa-actions button:disabled { color: var(--faint); cursor: default; }
    .qa-actions #qa-send { background: var(--accent); border-color: transparent; }
    .qa-actions #qa-stop { color: var(--warn); }

    @media (max-width: 1180px) {
      .qa { flex-basis: 320px; }
    }
    @media (max-width: 1024px) {
      .layout { flex-wrap: wrap; }
      .sidebar { flex: 0 0 240px; }
      .reader { flex: 1 1 420px; }
      .qa { flex: 1 1 100%; position: static; height: 480px; }
    }
    @media (max-width: 860px) {
      .layout { flex-direction: column; padding: 12px; }
      .sidebar { position: static; flex: none; width: 100%; max-height: 300px; }
      .reader { width: 100%; min-height: auto; padding: 16px; }
      .qa { width: 100%; height: 460px; }
      header { padding: 10px 14px; }
      .brand small { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1 id="course-title">课程</h1>
      <small>Walle 学习空间</small>
    </div>
    <div class="head-links">
      <a href="/courses">全部课程</a>
      <a href="/">对话</a>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div id="course-goal" class="course-goal"></div>
      <div class="nav-head">学习计划</div>
      <nav id="lesson-nav" class="lesson-nav"></nav>
    </aside>
    <main class="reader">
      <div id="reader-head" class="reader-head"></div>
      <article id="content" class="md"></article>
      <div class="lesson-actions">
        <button id="prev" type="button">上一课</button>
        <button id="next" type="button">下一课</button>
      </div>
    </main>
    <section class="qa" aria-label="课程答疑">
      <div class="qa-head">
        <div>
          <strong>课程答疑</strong>
          <div id="qa-lesson" class="qa-sub">当前课节</div>
        </div>
        <span id="qa-status" class="qa-status">连接中…</span>
      </div>
      <div id="qa-log" class="qa-log">
        <div id="qa-empty" class="qa-empty">
          就当前课节提问，导师会结合课程资料回答。
        </div>
      </div>
      <div class="qa-compose">
        <textarea id="qa-input" rows="2" placeholder="问一个关于当前课节的问题…"></textarea>
        <div class="qa-actions">
          <button id="qa-stop" type="button" hidden>停止</button>
          <button id="qa-send" type="button" disabled>发送</button>
        </div>
      </div>
    </section>
  </div>
  <script src="/static/marked.min.js"></script>
  <script src="/static/katex/katex.min.js"></script>
  <script src="/static/katex/marked-katex.min.js"></script>
  <script src="/static/purify.min.js"></script>
  <script>
    const courseTitle = document.getElementById("course-title");
    const courseGoal = document.getElementById("course-goal");
    const lessonNav = document.getElementById("lesson-nav");
    const readerHead = document.getElementById("reader-head");
    const content = document.getElementById("content");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const qaLog = document.getElementById("qa-log");
    const qaEmpty = document.getElementById("qa-empty");
    const qaInput = document.getElementById("qa-input");
    const qaSend = document.getElementById("qa-send");
    const qaStop = document.getElementById("qa-stop");
    const qaStatus = document.getElementById("qa-status");
    const qaLesson = document.getElementById("qa-lesson");
    const courseId = decodeURIComponent(location.pathname.split("/").filter(Boolean)[1] || "");
    const state = { course: null, lessonId: null };
    let chatWs = null;
    let chatBusy = false;
    let chatCurrent = null;
    let chatLastRender = 0;
    let chatToolNote = null;

    if (window.marked && window.markedKatex) {
      window.marked.use(
        window.markedKatex({ throwOnError: false, nonStandard: true, trust: false })
      );
    }

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    async function api(path) {
      const response = await fetch(path, { cache: "no-store" });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
      return data;
    }

    function renderMarkdown(text) {
      const html = window.marked.parse(text || "", { gfm: true, breaks: true });
      return window.DOMPurify.sanitize(html, {
        USE_PROFILES: { html: true, mathMl: true },
      });
    }

    function stripLeadingTitle(markdown, title) {
      const text = markdown || "";
      const match = text.match(/^\s*#\s+([^\n]+)\n+/);
      if (match && match[1].trim() === (title || "").trim()) {
        return text.slice(match[0].length);
      }
      return text;
    }

    function qaScroll() {
      qaLog.scrollTop = qaLog.scrollHeight;
    }

    function qaNote(text) {
      const node = el("div", "qa-note", text);
      qaLog.append(node);
      qaScroll();
      return node;
    }

    function qaAdd(role, text) {
      qaEmpty.hidden = true;
      const node = el(
        "div",
        `qa-msg ${role}${role === "assistant" ? " md" : ""}`,
        text || ""
      );
      qaLog.append(node);
      qaScroll();
      return node;
    }

    function qaRenderAssistant(force = false) {
      if (!chatCurrent) return;
      const now = performance.now();
      if (!force && now - chatLastRender < 80) return;
      chatLastRender = now;
      chatCurrent.innerHTML = renderMarkdown(chatCurrent.dataset.text || "");
      for (const link of chatCurrent.querySelectorAll("a")) {
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      }
    }

    function qaHistory(items) {
      for (const item of items || []) {
        if (item.role !== "user" && item.role !== "assistant") continue;
        const node = qaAdd(item.role, item.content || "");
        if (item.role === "assistant") {
          node.innerHTML = renderMarkdown(item.content || "");
        }
      }
      qaScroll();
    }

    function setQaStatus(text, cls) {
      qaStatus.textContent = text;
      qaStatus.className = `qa-status${cls ? ` ${cls}` : ""}`;
    }

    function updateQaComposer() {
      const open = !!chatWs && chatWs.readyState === WebSocket.OPEN;
      qaSend.disabled = chatBusy || !open;
      qaSend.textContent = chatBusy ? "生成中" : "发送";
      qaStop.hidden = !chatBusy;
      qaStop.disabled = !open;
      if (!chatBusy) qaStop.textContent = "停止";
    }

    function resetQa() {
      if (chatWs) {
        const old = chatWs;
        chatWs = null;
        old.onclose = null;
        old.onerror = null;
        try { old.close(); } catch (err) { console.error(err); }
      }
      chatBusy = false;
      chatCurrent = null;
      chatLastRender = 0;
      chatToolNote = null;
      qaLog.replaceChildren(qaEmpty);
      qaEmpty.hidden = false;
      setQaStatus("连接中…", "");
      updateQaComposer();
    }

    function updateQaLesson() {
      const lesson = (state.course?.lessons || []).find(
        (item) => item.id === state.lessonId
      );
      qaLesson.textContent = lesson ? `当前：${lesson.title}` : "当前课节";
    }

    function connectChat() {
      if (!state.course || !state.course.qa_session_id) {
        setQaStatus("不可用", "off");
        return;
      }
      resetQa();
      const params = new URLSearchParams();
      if (state.course.workspace) params.set("cwd", state.course.workspace);
      params.set("session", state.course.qa_session_id);
      params.set("attach", "1");
      params.set("agent", "tutor");
      params.set("course", courseId);
      if (state.lessonId) params.set("lesson", state.lessonId);

      const proto = location.protocol === "https:" ? "wss" : "ws";
      const socket = new WebSocket(
        `${proto}://${location.host}/ws/chat?${params.toString()}`
      );
      chatWs = socket;
      socket.onopen = () => {
        setQaStatus("已连接", "on");
        updateQaComposer();
      };
      socket.onmessage = (event) => {
        if (chatWs !== socket) return;
        let msg;
        try { msg = JSON.parse(event.data); } catch (err) { console.error(err); return; }
        const data = msg.data || {};
        if (msg.type === "welcome") {
          setQaStatus("已连接", "on");
          qaHistory(msg.history);
          updateQaComposer();
        } else if (msg.type === "error") {
          setQaStatus("不可用", "off");
          qaNote(msg.message || "连接错误");
          chatBusy = false;
          updateQaComposer();
        } else if (msg.type === "notify" && data.type === "delta") {
          if (!chatCurrent) {
            chatCurrent = qaAdd("assistant", "");
            chatCurrent.dataset.text = "";
            chatLastRender = 0;
          }
          chatCurrent.dataset.text += data.delta || "";
          qaRenderAssistant();
          qaScroll();
        } else if (msg.type === "notify" && data.type === "delta_end") {
          qaRenderAssistant(true);
          chatCurrent = null;
          chatBusy = false;
          if (chatToolNote) { chatToolNote.remove(); chatToolNote = null; }
          updateQaComposer();
          if (data.reason) qaNote(`结束：${data.reason}`);
        } else if (msg.type === "notify" && data.type === "tool_start") {
          if (chatToolNote) chatToolNote.remove();
          chatToolNote = qaNote("查阅课程资料…");
        } else if (msg.type === "notify" && data.type === "tool_result") {
          if (chatToolNote) { chatToolNote.remove(); chatToolNote = null; }
        } else if (msg.type === "notify" && data.type === "error") {
          qaNote(`错误：${data.message || data.code || "unknown"}`);
          chatBusy = false;
          updateQaComposer();
        }
      };
      socket.onclose = () => {
        if (chatWs !== socket) return;
        setQaStatus("已断开", "off");
        chatBusy = false;
        updateQaComposer();
      };
      socket.onerror = () => {
        if (chatWs === socket) setQaStatus("连接错误", "off");
      };
    }

    function sendQa() {
      const text = qaInput.value.trim();
      if (!text || chatBusy || !chatWs || chatWs.readyState !== WebSocket.OPEN) return;
      qaAdd("user", text);
      qaInput.value = "";
      qaInput.style.height = "auto";
      chatCurrent = null;
      chatBusy = true;
      updateQaComposer();
      chatWs.send(JSON.stringify({ type: "input", content: text }));
    }

    function stopQa() {
      if (!chatWs || chatWs.readyState !== WebSocket.OPEN) return;
      chatWs.send(JSON.stringify({ type: "cancel" }));
      qaStop.disabled = true;
      qaStop.textContent = "停止中…";
      qaNote("正在停止当前回答…");
    }

    function embedCanvases() {
      for (const p of [...content.querySelectorAll("p")]) {
        const match = (p.textContent || "").trim().match(/^\{\{canvas:([A-Za-z0-9_-]+)\}\}$/);
        if (!match) continue;
        const frame = document.createElement("iframe");
        frame.className = "canvas-embed";
        frame.title = "交互演示";
        frame.loading = "lazy";
        frame.referrerPolicy = "no-referrer";
        frame.sandbox = "allow-scripts allow-forms allow-popups allow-modals allow-downloads";
        frame.src = `/courses/${encodeURIComponent(courseId)}/canvas/${encodeURIComponent(match[1])}`;
        p.replaceWith(frame);
      }
    }

    function renderNav() {
      lessonNav.replaceChildren();
      const lessons = state.course.lessons || [];
      lessons.forEach((lesson, index) => {
        const button = el("button", "lesson-link");
        button.type = "button";
        if (lesson.id === state.lessonId) button.classList.add("active");
        button.append(
          el("span", "lesson-index", String(lesson.order || index + 1).padStart(2, "0")),
          el("span", "", lesson.title || lesson.id)
        );
        button.onclick = () => selectLesson(lesson.id);
        lessonNav.append(button);
      });
    }

    function updateActions() {
      const lessons = state.course.lessons || [];
      const index = lessons.findIndex((item) => item.id === state.lessonId);
      prev.disabled = index <= 0;
      next.disabled = index < 0 || index >= lessons.length - 1;
    }

    async function selectLesson(lessonId, push = true) {
      if (!lessonId) return;
      if (
        lessonId === state.lessonId &&
        chatWs &&
        chatWs.readyState === WebSocket.OPEN
      ) {
        return;
      }
      state.lessonId = lessonId;
      localStorage.setItem(`walle.course.${courseId}.lesson`, lessonId);
      if (push) {
        history.replaceState(null, "", `?lesson=${encodeURIComponent(lessonId)}`);
      }
      updateQaLesson();
      connectChat();
      renderNav();
      updateActions();
      readerHead.replaceChildren();
      content.replaceChildren(el("div", "empty", "加载课节…"));
      try {
        const data = await api(
          `/api/courses/${encodeURIComponent(courseId)}/lessons/${encodeURIComponent(lessonId)}`
        );
        const lesson = data.lesson;
        readerHead.append(
          el("h2", "", lesson.title || lesson.id),
          el("span", "", `第 ${lesson.order || "?"} 课`)
        );
        content.innerHTML = renderMarkdown(
          stripLeadingTitle(lesson.markdown, lesson.title)
        );
        for (const link of content.querySelectorAll("a")) {
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        }
        embedCanvases();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (err) {
        content.replaceChildren(el("div", "empty", `课节加载失败：${err.message}`));
      }
    }

    function startLesson() {
      const lessons = state.course.lessons || [];
      if (!lessons.length) {
        content.replaceChildren();
        const empty = el("div", "empty");
        empty.append(
          el("strong", "", "课程还没有课节"),
          document.createTextNode("回到对话，让 Walle 继续写入课程内容。")
        );
        content.append(empty);
        updateQaLesson();
        connectChat();
        return;
      }
      const requested = new URLSearchParams(location.search).get("lesson");
      const saved = localStorage.getItem(`walle.course.${courseId}.lesson`);
      const known = lessons.some((item) => item.id === requested)
        ? requested
        : lessons.some((item) => item.id === saved)
          ? saved
          : lessons[0].id;
      selectLesson(known, false);
    }

    async function load() {
      try {
        const course = await api(`/api/courses/${encodeURIComponent(courseId)}`);
        state.course = course;
        courseTitle.textContent = course.title || course.id;
        document.title = `${course.title || course.id} · Walle`;
        courseGoal.textContent = course.goal || "";
        updateQaLesson();
        renderNav();
        startLesson();
      } catch (err) {
        courseTitle.textContent = "课程不存在";
        content.replaceChildren(el("div", "empty", `课程加载失败：${err.message}`));
      }
    }

    prev.addEventListener("click", () => {
      const lessons = state.course.lessons || [];
      const index = lessons.findIndex((item) => item.id === state.lessonId);
      if (index > 0) selectLesson(lessons[index - 1].id);
    });
    next.addEventListener("click", () => {
      const lessons = state.course.lessons || [];
      const index = lessons.findIndex((item) => item.id === state.lessonId);
      if (index >= 0 && index < lessons.length - 1) selectLesson(lessons[index + 1].id);
    });
    qaSend.addEventListener("click", sendQa);
    qaStop.addEventListener("click", stopQa);
    qaInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendQa();
      }
    });
    qaInput.addEventListener("input", () => {
      qaInput.style.height = "auto";
      qaInput.style.height = Math.min(qaInput.scrollHeight, 110) + "px";
    });

    updateQaComposer();
    load();
  </script>
</body>
</html>
