<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walle</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #171d24; --panel2: #1e2630;
      --border: #2b3542; --text: #e6edf3; --muted: #8b98a8;
      --accent: #2f81f7; --danger: #ff7b72; --ok: #3fb950;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    .app { width: min(100%, 860px); height: 100vh; display: flex; flex-direction: column; padding: 16px; gap: 10px; }
    header { display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 17px; margin: 0; }
    .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .dot.on { background: var(--ok); }
    .dot.off { background: var(--danger); }
    .log {
      flex: 1; overflow-y: auto; border: 1px solid var(--border);
      background: var(--panel); border-radius: 14px; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg { display: flex; gap: 9px; max-width: 88%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .who {
      width: 26px; height: 26px; flex: 0 0 26px; border-radius: 8px;
      display: grid; place-items: center; font-size: 11px;
      background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    }
    .msg.user .who { background: #173a63; color: #cfe3ff; }
    .bubble {
      padding: 9px 12px; border-radius: 12px; background: var(--panel2);
      border: 1px solid var(--border); font-size: 14px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: var(--accent); border-color: transparent; color: #fff; }
    .note { align-self: center; color: var(--muted); font-size: 12px; text-align: center; }
    .note.error { color: var(--danger); }
    .call {
      align-self: flex-start; max-width: 88%; width: 100%;
      background: #1b2430; border: 1px solid #3d4b5c;
      border-radius: 12px; padding: 12px; font-size: 13px;
    }
    .call .title { font-weight: 600; margin-bottom: 6px; }
    .call pre {
      background: #0b0f14; border: 1px solid var(--border); border-radius: 8px;
      padding: 8px; overflow-x: auto; margin: 6px 0; font-size: 12px;
    }
    .call .actions { display: flex; gap: 8px; margin-top: 10px; }
    .call .actions button { padding: 6px 10px; }
    .call .actions button.deny { background: #30363d; }
    .call input {
      width: 100%; margin-top: 8px; padding: 8px; border-radius: 8px;
      border: 1px solid var(--border); background: #0b0f14; color: var(--text);
      font: inherit; font-size: 13px;
    }
    .composer { display: flex; gap: 8px; border: 1px solid var(--border); background: var(--panel); border-radius: 12px; padding: 8px; }
    textarea {
      flex: 1; resize: none; border: 0; outline: 0; background: transparent;
      color: var(--text); font: inherit; font-size: 14px; line-height: 1.5;
      min-height: 28px; max-height: 140px; padding: 4px;
    }
    button {
      border: 0; border-radius: 9px; background: var(--accent); color: #fff;
      padding: 8px 14px; font-size: 13px; cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Walle</h1>
      <div class="status"><span id="dot" class="dot"></span><span id="status">连接中…</span></div>
    </header>
    <main id="log" class="log"></main>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="问点什么… Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send" disabled>发送</button>
    </div>
  </div>
  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const dot = document.getElementById("dot");

    let ws = null;
    let busy = false;
    let current = null;

    function setStatus(text, cls) {
      status.textContent = text;
      dot.className = "dot " + cls;
    }

    function scroll() { log.scrollTop = log.scrollHeight; }

    function add(role, text) {
      const row = document.createElement("div");
      row.className = "msg " + role;
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = role === "user" ? "你" : "AI";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text || "";
      row.append(who, bubble);
      log.append(row);
      scroll();
      return { row, bubble, text: text || "" };
    }

    function note(text, error = false) {
      const el = document.createElement("div");
      el.className = "note" + (error ? " error" : "");
      el.textContent = text;
      log.append(el);
      scroll();
    }

    function updateButton() {
      send.disabled = busy || !ws || ws.readyState !== WebSocket.OPEN;
      send.textContent = busy ? "生成中" : "发送";
    }

    function sendReply(id, data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "reply", id, data }));
      }
    }

    function handleCall(msg) {
      const data = msg.data || {};
      const card = document.createElement("div");
      card.className = "call";

      if (data.type === "approval") {
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = `工具审批：${data.tool_name || "unknown"}`;
        const args = document.createElement("pre");
        args.textContent = JSON.stringify(data.arguments || {}, null, 2);
        const actions = document.createElement("div");
        actions.className = "actions";
        const allow = document.createElement("button");
        allow.textContent = "允许";
        const deny = document.createElement("button");
        deny.textContent = "拒绝";
        deny.className = "deny";

        const finish = (text) => {
          allow.disabled = true;
          deny.disabled = true;
          note(text);
        };
        allow.onclick = () => {
          sendReply(msg.id, { approved: true });
          finish("已允许本次工具执行");
        };
        deny.onclick = () => {
          sendReply(msg.id, { approved: false });
          finish("已拒绝本次工具执行");
        };
        actions.append(allow, deny);
        card.append(title, args, actions);
      } else if (data.type === "inquiry") {
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = data.question || "需要你的回答";
        const input = document.createElement("input");
        input.placeholder = data.options && data.options.length
          ? `选项：${data.options.join(" / ")}`
          : "输入回答";
        const actions = document.createElement("div");
        actions.className = "actions";
        const reply = document.createElement("button");
        reply.textContent = "回答";
        reply.onclick = () => {
          const value = input.value.trim();
          if (!value) return;
          sendReply(msg.id, { content: value });
          input.disabled = true;
          reply.disabled = true;
          note("已提交回答");
        };
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") reply.click();
        });
        actions.append(reply);
        card.append(title, input, actions);
      } else {
        sendReply(msg.id, {});
        note("未知交互类型，已自动回复");
        return;
      }

      log.append(card);
      scroll();
    }

    function handle(msg) {
      if (msg.type === "call") {
        handleCall(msg);
        return;
      }
      if (msg.type === "welcome") {
        setStatus("已连接", "on");
        updateButton();
        return;
      }
      if (msg.type === "error") {
        note(msg.message || "连接错误", true);
        busy = false;
        updateButton();
        return;
      }
      if (msg.type !== "notify") return;

      const data = msg.data || {};
      if (data.type === "delta") {
        if (!current) current = add("assistant", "");
        current.text += data.delta || "";
        current.bubble.textContent = current.text;
        scroll();
      } else if (data.type === "delta_end") {
        current = null;
        busy = false;
        updateButton();
        if (data.reason) note("结束：" + data.reason, data.reason !== "max_turns");
      } else if (data.type === "tool_start") {
        note("🔧 " + (data.tool_name || "tool"));
      } else if (data.type === "tool_result") {
        note((data.error ? "❌ " : "✅ ") + (data.tool_call_id || ""));
      } else if (data.type === "error") {
        note("错误：" + (data.message || data.code || "unknown"), true);
        busy = false;
        updateButton();
      }
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/chat`);
      ws.onopen = () => { setStatus("已连接", "on"); updateButton(); };
      ws.onmessage = (event) => {
        try { handle(JSON.parse(event.data)); } catch (err) { console.error(err); }
      };
      ws.onclose = () => { setStatus("已断开", "off"); busy = false; updateButton(); };
      ws.onerror = () => setStatus("连接错误", "off");
    }

    function submit() {
      const text = input.value.trim();
      if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
      add("user", text);
      input.value = "";
      input.style.height = "auto";
      current = null;
      busy = true;
      updateButton();
      ws.send(JSON.stringify({ type: "input", content: text }));
    }

    send.addEventListener("click", submit);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        submit();
      }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    connect();
    updateButton();
  </script>
</body>
</html>
