<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walle</title>
  <link rel="stylesheet" href="/static/katex/katex.min.css">
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --panel3: #222b39;
      --border: #2c3644; --border-strong: #3d4b5f;
      --text: #e6edf3; --muted: #8b98a8; --faint: #66717f;
      --accent: #2f81f7; --accent-soft: #173a63;
      --danger: #ff7b72; --danger-soft: #3b1d1f;
      --ok: #3fb950; --ok-soft: #14301c;
      --warn: #d29922; --warn-soft: #33270d;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    /* 主内容区隐藏滚动条，保留滚轮/触控滚动 */
    .log, .page-view, .course-reader, .course-sidebar, .lesson-nav,
    .call-body, .modal-card, .session-list, .workspace-recent {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .log::-webkit-scrollbar, .page-view::-webkit-scrollbar,
    .course-reader::-webkit-scrollbar, .course-sidebar::-webkit-scrollbar,
    .lesson-nav::-webkit-scrollbar, .call-body::-webkit-scrollbar,
    .modal-card::-webkit-scrollbar, .session-list::-webkit-scrollbar,
    .workspace-recent::-webkit-scrollbar { width: 0; height: 0; display: none; }
    /* 代码/参数区保留细暗色滚动条，避免白色默认样式 */
    pre::-webkit-scrollbar { width: 6px; height: 6px; }
    pre::-webkit-scrollbar-track { background: transparent; }
    pre::-webkit-scrollbar-thumb { background: #2b3650; border-radius: 999px; }
    body {
      margin: 0; min-height: 100vh;
      background:
        radial-gradient(1100px 500px at 15% -10%, #17233a 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    .shell {
      width: 100%; max-width: 1680px; margin: 0 auto; height: 100vh;
      display: flex; justify-content: center; align-items: stretch;
      gap: 0; padding: 12px;
    }
    .app {
      width: min(100%, 880px); max-width: 880px; min-width: 360px; flex: 0 1 880px;
      height: 100%; display: flex; flex-direction: column; overflow: hidden;
      background: var(--panel); border: 1px solid var(--border-strong); border-radius: 14px;
    }
    body.canvas-open .app { flex: 1 1 360px; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 14px; min-height: 52px; flex: 0 0 auto;
      background: #121821; border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .plugin-nav { display: inline-flex; align-items: center; gap: 6px; }
    .plugin-host {
      flex: 1 1 auto; min-width: 0; height: 100%;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .plugin-host[hidden] { display: none; }
    .status { white-space: nowrap; }
    h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
    .brand small { color: var(--faint); font-size: 11px; }
    #canvas-latest { align-self: center; padding: 4px 10px; font-size: 12px; }
    .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .dot.on { background: var(--ok); box-shadow: 0 0 8px #3fb95088; }
    .dot.off { background: var(--danger); }
    .log {
      flex: 1; min-height: 0; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
      scroll-behavior: smooth;
    }
    .msg { display: flex; gap: 9px; max-width: 88%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .who {
      width: 26px; height: 26px; flex: 0 0 26px; border-radius: 8px;
      display: grid; place-items: center; font-size: 11px;
      background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    }
    .msg.user .who { background: var(--accent-soft); color: #cfe3ff; }
    .bubble {
      padding: 9px 12px; border-radius: 12px; background: var(--panel2);
      border: 1px solid var(--border); font-size: 14px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: var(--accent); border-color: transparent; color: #fff; }
    .note { align-self: center; color: var(--muted); font-size: 12px; text-align: center; }

    /* ── 空状态与快捷提示 ────────────────────────── */
    .chat-empty {
      margin: auto; max-width: 420px; padding: 20px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      text-align: center; color: var(--muted);
    }
    .chat-empty .empty-mark {
      width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
      font-size: 20px; color: #9cc7ff; background: var(--accent-soft); border: 1px solid #24507f;
    }
    .chat-empty strong { color: var(--text); font-size: 16px; }
    .chat-empty p { margin: 0; font-size: 13px; line-height: 1.7; }
    .hints { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 4px; }
    .hint {
      padding: 5px 10px; font-size: 12px; border-radius: 999px;
      background: #121821; color: var(--muted); border: 1px solid var(--border);
    }
    .hint:hover:not(:disabled) { color: var(--text); border-color: var(--border-strong); }
    .chat-empty[hidden] { display: none; }

    /* ── 工作区 / 会话选择 ───────────────────────── */
    #workspace-button, #agent-mode { align-self: center; padding: 4px 10px; font-size: 12px; }
    #agent-mode.on {
      border-color: var(--accent); background: var(--accent-soft); color: #cfe3ff;
    }
    a.ghost {
      align-self: center; display: inline-flex; align-items: center;
      padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--panel2); color: var(--text); font-size: 12px;
      text-decoration: none;
    }
    a.ghost:hover { border-color: var(--border-strong); background: var(--panel3); }
    a.canvas-card { color: var(--text); text-decoration: none; }
    .modal {
      position: fixed; inset: 0; z-index: 60; padding: 16px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(4, 8, 14, .66);
    }
    .modal[hidden] { display: none; }
    .modal-card {
      width: min(680px, 100%); max-height: min(82vh, 720px); overflow: auto;
      padding: 16px; background: var(--panel);
      border: 1px solid var(--border-strong); border-radius: 14px;
    }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .modal-kicker { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
    .modal-path {
      margin-top: 3px; font-family: var(--mono); font-size: 12px;
      color: #9cc7ff; word-break: break-all;
    }
    .workspace-form { display: flex; gap: 8px; margin: 12px 0; }
    .workspace-form input {
      flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: #0b0f14;
      color: var(--text); font-family: var(--mono); font-size: 12px;
    }
    .workspace-recent { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .workspace-recent button { padding: 5px 9px; font-size: 12px; }
    .workspace-recent button.active { border-color: var(--accent); color: #cfe3ff; }
    .session-head {
      display: flex; align-items: center; justify-content: space-between;
      margin: 6px 0 8px;
    }
    .session-head strong { font-size: 13px; }
    .session-list { display: flex; flex-direction: column; gap: 6px; }
    .session-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 10px 12px; text-align: left; cursor: pointer;
      border: 1px solid var(--border); border-radius: 9px; background: #121821;
    }
    .session-item:hover { border-color: var(--border-strong); background: var(--panel2); }
    .session-item.active { border-color: var(--accent); }
    .session-item .session-title {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-size: 13px; color: var(--text);
    }
    .session-item .session-time { color: var(--faint); font-size: 11px; white-space: nowrap; }
    .session-empty { padding: 8px 2px; color: var(--muted); font-size: 12px; }

    /* ── Markdown（仅助手消息）────────────────────── */
    .bubble.md { white-space: normal; }
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md h1, .md h2, .md h3, .md h4 { margin: 14px 0 6px; line-height: 1.35; }
    .md h1 { font-size: 1.35em; }
    .md h2 { font-size: 1.2em; }
    .md h3 { font-size: 1.08em; }
    .md p { margin: 6px 0; }
    .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
    .md li { margin: 2px 0; }
    .md code {
      font-family: var(--mono); font-size: .9em; padding: 1px 5px;
      border-radius: 5px; background: #0b0f14; border: 1px solid var(--border);
    }
    .md pre {
      margin: 8px 0; padding: 10px 12px; border-radius: 8px; overflow-x: auto;
      background: #0b0f14; border: 1px solid var(--border);
    }
    .md pre code {
      padding: 0; border: 0; background: none;
      font-size: 12px; line-height: 1.55; white-space: pre;
    }
    .md blockquote {
      margin: 8px 0; padding: 2px 12px; color: var(--muted);
      border-left: 3px solid var(--border-strong);
    }
    .md a { color: #79b8ff; }
    .md hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
    .md .katex { font-size: 1.05em; }
    .md .katex-display {
      margin: 10px 0; padding: 2px 0;
      overflow-x: auto; overflow-y: hidden;
    }
    .md table {
      border-collapse: collapse; margin: 8px 0; max-width: 100%;
      display: block; overflow-x: auto;
    }
    .md th, .md td { border: 1px solid var(--border); padding: 5px 8px; font-size: 13px; }
    .md th { background: #121821; }
    .md img { max-width: 100%; border-radius: 8px; }
    .md del { color: var(--faint); }
    .note.error { color: var(--danger); }

    /* ── 交互卡片（审批 / 提问）────────────────────── */
    .call {
      align-self: flex-start; width: min(100%, 640px);
      display: flex; flex-direction: column; flex-shrink: 0;
      max-height: min(70vh, 560px);  /* 长参数不撑出视口，按钮始终可见 */
      background: linear-gradient(180deg, #1a2230 0%, #161d28 100%);
      border: 1px solid var(--border-strong);
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 6px 24px #0005;
    }
    .call-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; flex: 0 0 auto; }
    .call-ico {
      width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px;
      display: grid; place-items: center; font-size: 15px;
      background: var(--warn-soft); border: 1px solid #5a4718;
    }
    .call[data-state="allowed"] .call-ico { background: var(--accent-soft); border-color: #24507f; }
    .call[data-state="denied"] .call-ico,
    .call[data-state="failed"] .call-ico { background: var(--danger-soft); border-color: #5d2a2a; }
    .call[data-state="done"] .call-ico { background: var(--ok-soft); border-color: #245a30; }
    .call-title { flex: 1; min-width: 0; }
    .call-kicker { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
    .call-name {
      font-size: 14px; font-weight: 600; margin-top: 1px;
      font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .call-body {
      padding: 4px 14px 12px; display: flex; flex-direction: column; gap: 8px;
      min-height: 0; overflow-y: auto;  /* 只在这里滚，避免内层 cmd 抢滚轮 */
    }
    .call-question { font-size: 14px; line-height: 1.6; }
    .args { display: flex; flex-direction: column; gap: 6px; }
    .arg {
      display: grid; grid-template-columns: minmax(64px, max-content) 1fr;
      gap: 10px; align-items: start;
      background: #0b0f14; border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 9px;
    }
    .arg-key { color: var(--muted); font-size: 12px; font-family: var(--mono); padding-top: 1px; }
    .arg-val {
      margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.55;
      color: #c9d6e4; white-space: pre-wrap; word-break: break-word;
    }
    .result { border-top: 1px solid var(--border); padding-top: 6px; margin-top: 2px; }
    .args-block summary, .result summary {
      display: flex; align-items: center; gap: 6px; min-width: 0;
      list-style: none; cursor: pointer; user-select: none;
      color: var(--muted); font-size: 12px;
    }
    .args-block summary::-webkit-details-marker,
    .result summary::-webkit-details-marker { display: none; }
    .args-block summary::before, .result summary::before {
      content: "▸"; font-size: 10px; flex: 0 0 auto;
      transition: transform .15s ease;
    }
    .args-block[open] summary::before, .result[open] summary::before {
      transform: rotate(90deg);
    }
    .args-block .args { margin-top: 6px; }
    .args-label {
      color: var(--text); flex: 0 0 auto;
      font-size: 12px; font-weight: 400; line-height: 1.45;
    }
    .args-preview {
      color: var(--faint); font-family: var(--mono); font-size: 11px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
    }
    .result pre {
      margin: 6px 0 0; padding: 8px; border-radius: 8px;
      background: #0b0f14; border: 1px solid var(--border);
      color: #c9d6e4; font-family: var(--mono); font-size: 12px;
      line-height: 1.55; white-space: pre-wrap; word-break: break-word;
      max-height: 240px; overflow: auto;
    }
    .call-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 14px; border-top: 1px solid var(--border);
      background: #121821; flex: 0 0 auto;
    }
    .call-hint { font-size: 12px; color: var(--faint); }
    .call-hint.running { color: var(--accent); }
    .call-hint.ok { color: var(--ok); }
    .call-hint.fail { color: var(--danger); }
    .actions { display: flex; gap: 8px; margin-left: auto; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; padding: 3px 9px; border-radius: 999px;
      border: 1px solid var(--border-strong); color: var(--muted);
      background: #10151d; white-space: nowrap;
    }
    .pill.pending { color: var(--warn); border-color: #5a4718; background: var(--warn-soft); }
    .pill.running { color: #79b8ff; border-color: #24507f; background: var(--accent-soft); }
    .pill.ok { color: var(--ok); border-color: #245a30; background: var(--ok-soft); }
    .pill.denied, .pill.fail { color: var(--danger); border-color: #5d2a2a; background: var(--danger-soft); }
    .pill[hidden] { display: none; }
    .call-head .actions button { padding: 6px 12px; }
    .pill.running::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%;
      border: 2px solid currentColor; border-right-color: transparent;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .options { display: flex; flex-wrap: wrap; gap: 8px; }
    .call input.inquiry-input {
      width: 100%; margin-top: 2px; padding: 9px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: #0b0f14; color: var(--text);
      font: inherit; font-size: 13px; outline: none;
    }
    .call input.inquiry-input:focus { border-color: var(--accent); }

    /* ── 工具执行状态条 ───────────────────────────── */
    .tool-row {
      align-self: flex-start; display: flex; align-items: center; gap: 8px;
      max-width: 88%; font-size: 12px; color: var(--muted);
      background: #121821; border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 11px;
    }
    .tool-row .tool-name { font-family: var(--mono); color: #c9d6e4; }
    .tool-row .tool-state { color: var(--faint); }
    .tool-row.ok .tool-state { color: var(--ok); }
    .tool-row.fail { border-color: #5d2a2a; }
    .tool-row.fail .tool-state { color: var(--danger); }
    .tool-row.running .tool-ico { animation: spin 1.1s linear infinite; display: inline-block; }
    .tool-error {
      align-self: flex-start; max-width: 88%; font-size: 12px; color: var(--danger);
      background: var(--danger-soft); border: 1px solid #5d2a2a; border-radius: 8px;
      padding: 6px 10px; white-space: pre-wrap; word-break: break-word;
    }
    .tool-history {
      align-self: flex-start; max-width: 88%; width: 100%;
      border: 1px solid var(--border); background: #121821;
      border-radius: 10px; padding: 8px 11px;
      font-size: 12px; color: var(--muted);
    }
    .tool-history summary {
      cursor: pointer; color: #c9d6e4; font-family: var(--mono);
    }
    .tool-history pre {
      margin: 8px 0 0; max-height: 240px; overflow: auto;
      white-space: pre-wrap; word-break: break-word;
      color: var(--muted); font: 12px/1.55 var(--mono);
    }

    /* ── 待审批提示条 ─────────────────────────────── */
    .approval-bar {
      display: flex; align-items: center; gap: 8px; margin: 0 12px 8px;
      padding: 8px 12px; border-radius: 10px;
      border: 1px solid #5a4718; background: var(--warn-soft);
      color: #e3b341; font-size: 12px;
    }
    .approval-bar[hidden] { display: none; }
    .approval-bar button {
      margin-left: auto; padding: 4px 10px; font-size: 12px;
      color: #e3b341; border-color: #5a4718;
    }

    /* ── 画布 ────────────────────────────────────── */
    .canvas-card {
      align-self: flex-start; width: min(100%, 520px);
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 12px; cursor: pointer;
      background: linear-gradient(180deg, #1a2230 0%, #161d28 100%);
      border: 1px solid var(--border-strong);
      transition: border-color .15s ease, background .15s ease;
    }
    .canvas-card:hover { border-color: #4a5d78; background: #1b2431; }
    .canvas-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .canvas-card .canvas-title { flex: 1; min-width: 0; }
    .canvas-card .canvas-kicker { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
    .canvas-card .canvas-name {
      font-size: 14px; font-weight: 600; margin-top: 1px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .canvas-card .canvas-open {
      flex: 0 0 auto; padding: 5px 10px; font-size: 12px;
      color: #79b8ff; white-space: nowrap;
    }

    .canvas-panel {
      position: relative; z-index: 1; flex: 0 0 var(--canvas-width, 40%);
      min-width: 320px; max-width: min(70%, calc(100% - 366px));
      height: 100%; display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--border-strong);
      border-radius: 14px; overflow: hidden;
    }

    /* 6px 拖拽分隔条：无可见竖线，只保留拖拽热区 */
    .splitter {
      flex: 0 0 6px; align-self: stretch;
      cursor: col-resize; touch-action: none;
    }
    .splitter[hidden] { display: none; }
    body.resizing { cursor: col-resize; user-select: none; }
    body.resizing iframe { pointer-events: none; }
    .canvas-panel[hidden] { display: none; }
    .canvas-panel.full {
      position: fixed; inset: 0; z-index: 100; flex: none;
      width: 100vw; height: 100vh; max-width: none; min-width: 0;
      border: 0; border-radius: 0;
    }
    body.canvas-full .app, body.canvas-full .splitter { display: none; }
    body.canvas-full { overflow: hidden; }
    .canvas-head {
      display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
      padding: 10px 12px; min-height: 52px;
      border-bottom: 1px solid var(--border); background: #121821;
    }
    .canvas-head .canvas-title { flex: 1; min-width: 0; }
    .canvas-head .canvas-kicker { font-size: 10px; color: var(--muted); letter-spacing: .4px; }
    #canvas-name {
      font-size: 13px; font-weight: 600; margin-top: 1px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .canvas-head button { padding: 5px 10px; font-size: 12px; }
    .canvas-panel iframe { flex: 1; width: 100%; border: 0; background: #fff; }
    .canvas-panel iframe[hidden] { display: none; }
    .canvas-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 32px 24px; color: var(--muted);
      background: radial-gradient(480px 300px at 50% 42%, #1a2740 0%, transparent 72%);
    }
    .canvas-empty[hidden] { display: none; }
    .canvas-empty-card {
      width: min(100%, 430px); padding: 28px 24px; border-radius: 18px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      text-align: center; border: 1px dashed var(--border-strong);
      background: linear-gradient(180deg, #1a2230 0%, #141b26 100%);
      box-shadow: inset 0 1px 0 #ffffff0a, 0 12px 40px #0004;
    }
    .canvas-empty strong { color: var(--text); font-size: 15px; }
    .canvas-empty p { margin: 0; font-size: 13px; line-height: 1.7; }
    .canvas-empty code { font-family: var(--mono); color: #9cc7ff; }

    /* ── 输入区 ──────────────────────────────────── */
    .composer {
      display: flex; align-items: flex-end; gap: 8px; flex: 0 0 auto;
      margin: 0 12px 12px; padding: 6px;
      border: 1px solid var(--border); background: #121821;
      border-radius: 10px;
    }
    textarea {
      flex: 1; resize: none; border: 0; outline: 0; background: transparent;
      color: var(--text); font: inherit; font-size: 14px; line-height: 1.5;
      min-height: 28px; max-height: 140px; padding: 4px;
    }
    button {
      border: 0; border-radius: 9px; background: var(--accent); color: #fff;
      padding: 8px 14px; font-size: 13px; cursor: pointer;
      transition: filter .15s ease, background .15s ease, opacity .15s ease;
    }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border-strong);
    }
    button.ghost:hover:not(:disabled) { color: var(--text); background: #ffffff0d; }
    button.danger { background: transparent; color: var(--danger); border: 1px solid #5d2a2a; }
    button.danger:hover:not(:disabled) { background: var(--danger-soft); }
    button.primary { background: var(--accent); }
    .stop { flex: 0 0 auto; }
    .stop.running { color: var(--warn); border-color: #5a4718; }
    .stop[hidden] { display: none; }

    @media (max-width: 860px) {
      .shell { padding: 0; gap: 0; }
      .app {
        flex: 1 1 auto; width: 100%; max-width: none; min-width: 0;
        border: 0; border-radius: 0;
      }
      .splitter { display: none; }
      .canvas-panel {
        position: fixed; inset: 0; z-index: 30; flex: none;
        width: 100vw; max-width: none; height: 100vh;
        border: 0; border-radius: 0;
      }
      header { padding: 10px; }
      .log { padding: 10px; }
    }
    @media (max-width: 560px) {
      .msg, .call, .tool-row, .tool-error { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
  <div id="plugin-view" class="plugin-host" hidden></div>
  <div class="app">
    <header>
      <div class="brand">
        <h1>Walle</h1><small>web channel</small>
        <button id="canvas-latest" class="ghost">画布</button>
        <button id="workspace-button" class="ghost" title="选择工作目录与会话">工作区</button>
        <button id="agent-mode" class="ghost" title="切换通用 / 学习模式">学习模式</button>
        <nav id="plugin-nav" class="plugin-nav"></nav>
      </div>
      <div class="status"><span id="dot" class="dot"></span><span id="status">连接中…</span></div>
    </header>
    <main id="log" class="log">
      <div id="chat-empty" class="chat-empty">
        <div class="empty-mark">✦</div>
        <strong>开始对话</strong>
        <p>直接提问，或让 Walle 在右侧画布中画图、推公式、做动效。</p>
        <div class="hints">
          <button class="hint" data-prompt="解释一下 Transformer 的注意力机制">解释概念</button>
          <button class="hint" data-prompt="帮我写一个 Python 脚本">写段代码</button>
          <button class="hint" data-prompt="把这个任务拆成几个步骤">拆解任务</button>
        </div>
      </div>
    </main>
    <div id="approval-bar" class="approval-bar" hidden>
      <span>🔔</span>
      <span id="approval-text">有工具等待审批</span>
      <button id="approval-jump" class="ghost">查看</button>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="问点什么… Enter 发送，Shift+Enter 换行"></textarea>
      <button id="stop" class="ghost danger stop" hidden>停止</button>
      <button id="send" disabled>发送</button>
    </div>
  </div>
  <div id="canvas-splitter" class="splitter" hidden
    role="separator" aria-label="调整画布宽度" title="拖动调整宽度，双击重置"></div>
  <aside id="canvas-panel" class="canvas-panel" hidden aria-label="画布">
    <div class="canvas-head">
      <div class="canvas-title">
        <div class="canvas-kicker">画布</div>
        <div id="canvas-name"></div>
      </div>
      <button id="canvas-full" class="ghost">放大</button>
      <button id="canvas-close" class="ghost">关闭</button>
    </div>
    <div id="canvas-empty" class="canvas-empty">
      <div class="canvas-empty-card">
        <strong>画布准备好了</strong>
        <p>让 Walle 在这里画图表、推导公式，<br>或做一段可交互的动效。</p>
        <div class="hints">
          <button class="hint" data-prompt="用 canvas 工具画一个 sin(x) 函数图像">sin(x) 函数</button>
          <button class="hint" data-prompt="用 canvas 工具画一个排序算法流程图">算法流程图</button>
          <button class="hint" data-prompt="用 canvas 工具演示一个弹簧振子动画">弹簧振子</button>
        </div>
      </div>
    </div>
    <iframe id="canvas-frame" title="画布内容" hidden
      sandbox="allow-scripts allow-forms allow-popups allow-modals allow-downloads"
      referrerpolicy="no-referrer"></iframe>
  </aside>
  </div>
  <div id="workspace-modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="工作区与会话">
      <div class="modal-head">
        <div>
          <div class="modal-kicker">工作目录</div>
          <div id="workspace-path" class="modal-path">—</div>
        </div>
        <button id="workspace-close" class="ghost">关闭</button>
      </div>
      <form id="workspace-form" class="workspace-form">
        <input id="workspace-input" type="text" placeholder="/path/to/workspace"
          autocomplete="off" spellcheck="false">
        <button class="primary" type="submit">打开</button>
      </form>
      <div id="workspace-recent" class="workspace-recent"></div>
      <div class="session-head">
        <strong>会话</strong>
        <button id="session-new" class="primary" type="button">新建会话</button>
      </div>
      <div id="session-list" class="session-list"></div>
    </div>
  </div>
  <script src="/static/marked.min.js"></script>
  <script src="/static/katex/katex.min.js"></script>
  <script src="/static/katex/marked-katex.min.js"></script>
  <script src="/static/purify.min.js"></script>
  <script src="/static/app/conversation.js"></script>
  <script src="/static/app/plugins.js"></script>
  <script>
    const log = document.getElementById("log");
    const chatEmpty = document.getElementById("chat-empty");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const stop = document.getElementById("stop");
    const status = document.getElementById("status");
    const dot = document.getElementById("dot");

    if (window.marked && window.markedKatex) {
      window.marked.use(
        window.markedKatex({ throwOnError: false, nonStandard: true, trust: false })
      );
    }

    let busy = false;
    let current = null;
    // tool_call_id → { card, pill, hint, actions, allow, deny, decision }
    const approvals = new Map();
    const tools = new Map();
    let prepareRow = null;
    const approvalBar = document.getElementById("approval-bar");
    const approvalText = document.getElementById("approval-text");
    const approvalJump = document.getElementById("approval-jump");
    const canvasPanel = document.getElementById("canvas-panel");
    const canvasSplitter = document.getElementById("canvas-splitter");
    const canvasFrame = document.getElementById("canvas-frame");
    const canvasEmpty = document.getElementById("canvas-empty");
    const canvasName = document.getElementById("canvas-name");
    const canvasFull = document.getElementById("canvas-full");
    const canvasClose = document.getElementById("canvas-close");
    const canvasLatest = document.getElementById("canvas-latest");
    const workspaceButton = document.getElementById("workspace-button");
    const agentModeButton = document.getElementById("agent-mode");
    const workspaceModal = document.getElementById("workspace-modal");
    const workspaceClose = document.getElementById("workspace-close");
    const workspacePath = document.getElementById("workspace-path");
    const workspaceForm = document.getElementById("workspace-form");
    const workspaceInput = document.getElementById("workspace-input");
    const workspaceRecent = document.getElementById("workspace-recent");
    const sessionNew = document.getElementById("session-new");
    const sessionList = document.getElementById("session-list");
    const workspaceState = { cwd: "", active: "", defaultCwd: "" };
    let agentMode = localStorage.getItem("walle.agent") === "learning" ? "learning" : "";
    const conversationStore = new WalleConversation.ConversationStore({ agentMode });
    const conversation = new WalleConversation.ConversationController({
      store: conversationStore,
      onMessage: handle,
      onStatus: (text, cls) => setStatus(text, cls),
      onOpen: () => updateComposer(),
      onBeforeConnect: () => resetChat(),
      onSessionChange: (cwd, sessionId) => {
        workspaceState.cwd = cwd || "";
        workspaceState.active = sessionId;
        if (cwd) {
          setWorkspaceLabel(cwd);
          localStorage.setItem("walle.cwd", cwd);
        }
        localStorage.setItem("walle.session", sessionId);
      },
    });
    const emptyStrong = chatEmpty.querySelector("strong");
    const emptyCopy = chatEmpty.querySelector("p");
    const emptyHints = [...chatEmpty.querySelectorAll(".hint")];
    const generalHints = emptyHints.map((node) => [node.textContent, node.dataset.prompt]);
    const learningHints = [
      ["学傅里叶变换", "我想学傅里叶变换，请制定学习计划并准备学习资料"],
      ["4 周计划", "帮我制定一个 4 周的学习计划"],
      ["从零学线代", "从零开始学线性代数"],
    ];
    // canvas_id → { id, sessionId, title, version, card, name }
    const canvases = new Map();
    let shownCanvas = null;
    let latestCanvas = null;
    const savedCanvasWidth = Number(localStorage.getItem("walle.canvasWidth"));
    if (savedCanvasWidth >= 320) {
      document.documentElement.style.setProperty("--canvas-width", `${savedCanvasWidth}px`);
    }

    function setStatus(text, cls) {
      status.textContent = text;
      dot.className = "dot " + cls;
    }

    function scroll() { log.scrollTop = log.scrollHeight; }

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function add(role, text) {
      if (chatEmpty) chatEmpty.hidden = true;
      const row = el("div", "msg " + role);
      const who = el("div", "who", role === "user" ? "你" : "AI");
      const bubble = el("div", "bubble" + (role === "assistant" ? " md" : ""), text || "");
      row.append(who, bubble);
      log.append(row);
      scroll();
      return { row, bubble, text: text || "" };
    }

    function note(text, error = false) {
      log.append(el("div", "note" + (error ? " error" : ""), text));
      scroll();
    }

    function baseName(path) {
      const parts = String(path || "").split(/[\\/]/).filter(Boolean);
      return parts.length ? parts[parts.length - 1] : "";
    }

    function timeText(value) {
      if (!value) return "";
      const date = new Date(Number(value) * 1000);
      return Number.isNaN(date.getTime()) ? "" : date.toLocaleString();
    }

    function setWorkspaceLabel(path) {
      workspaceButton.textContent = path ? `工作区 · ${baseName(path)}` : "工作区";
      workspaceButton.title = path || "选择工作目录与会话";
    }

    function applyAgentMode(mode, live = false) {
      agentMode = mode === "learning" ? "learning" : "";
      localStorage.setItem("walle.agent", agentMode || "default");
      const on = agentMode === "learning";
      agentModeButton.classList.toggle("on", on);
      agentModeButton.textContent = on ? "学习模式 · 开" : "学习模式";
      agentModeButton.title = on
        ? "已开启学习模式：当前会话由学习导师处理"
        : "切换通用 / 学习模式";
      input.placeholder = on
        ? "想学什么？我来制定学习计划和资料…"
        : "问点什么… Enter 发送，Shift+Enter 换行";
      if (emptyStrong) emptyStrong.textContent = on ? "开始学习" : "开始对话";
      if (emptyCopy) {
        emptyCopy.textContent = on
          ? "告诉我想学什么，学习导师会制定计划、写课节，并配交互画布。"
          : "直接提问，或让 Walle 在右侧画布中画图、推公式、做动效。";
      }
      const hints = on ? learningHints : generalHints;
      emptyHints.forEach((node, index) => {
        if (!hints[index]) return;
        node.textContent = hints[index][0];
        node.dataset.prompt = hints[index][1];
      });
      // 当前连接可用时直接切 agent，不断开、不重建会话；
      // 若恰好断线，下一次重连带上待切换的 agent。
      if (live) conversation.setMode(agentMode);
      else conversationStore.set({ agentMode });
    }

    function resetChat() {
      approvals.clear();
      tools.clear();
      canvases.clear();
      prepareRow = null;
      shownCanvas = null;
      latestCanvas = null;
      current = null;
      busy = false;
      lastRender = 0;
      if (!canvasPanel.hidden) closeCanvas();
      log.replaceChildren(chatEmpty);
      chatEmpty.hidden = false;
      refreshPending();
      updateComposer();
    }

    function historyToolName(call) {
      const fn = call && call.function ? call.function : call || {};
      return fn.name || call?.name || "tool";
    }

    function historyToolArgs(call) {
      const fn = call && call.function ? call.function : call || {};
      return fn.arguments || call?.arguments || "";
    }

    function addHistoryTool(call, output) {
      if (chatEmpty) chatEmpty.hidden = true;
      const details = el("details", "tool-history");
      details.append(el("summary", "", `工具 · ${historyToolName(call)}`));
      const args = historyToolArgs(call);
      if (args) details.append(el("pre", "", String(args)));
      if (output !== undefined && output !== null) {
        details.append(el("pre", "", String(output)));
      }
      log.append(details);
      return details;
    }

    function renderHistory(items) {
      const calls = new Map();
      for (const item of items || []) {
        if (item.role === "assistant") {
          if ((item.content || "").trim()) {
            const view = add("assistant", item.content || "");
            const html = renderMarkdown(item.content || "");
            if (html !== null) view.bubble.innerHTML = html;
          }
          for (const call of item.tool_calls || []) {
            const details = addHistoryTool(call);
            if (call.id) calls.set(call.id, details);
          }
        } else if (item.role === "tool") {
          const details = calls.get(item.tool_call_id);
          if (details) {
            details.append(el("pre", "", item.content || ""));
          } else {
            addHistoryTool(null, item.content || "");
          }
        } else if (item.role === "user") {
          add("user", item.content || "");
        }
      }
      scroll();
    }

    async function api(path) {
      const response = await fetch(path, { cache: "no-store" });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.detail || `HTTP ${response.status}`);
      }
      return data;
    }

    function newSessionId() {
      const raw = window.crypto && crypto.randomUUID
        ? crypto.randomUUID().replaceAll("-", "")
        : Math.random().toString(16).slice(2);
      return `web-${raw.slice(0, 12)}`;
    }

    const pluginView = document.getElementById("plugin-view");
    const router = new WallePlugins.Router({ onRoute: renderRoute });

    function renderRoute(route) {
      const handled = WallePlugins.render(route, pluginView);
      pluginView.hidden = !handled;
      document.body.classList.toggle("view-plugin", handled);
      if (handled) {
        if (!canvasPanel.hidden) closeCanvas();
        return true;
      }
      document.body.classList.remove("view-courses", "view-course");
      refreshPending();
      return false;
    }

    function closeWorkspaceModal() {
      workspaceModal.hidden = true;
    }

    function renderWorkspaceRecent() {
      workspaceRecent.replaceChildren();
      const known = new Set();
      const addButton = (path, label, active) => {
        const button = el("button", "ghost", label);
        button.title = path;
        if (active) button.classList.add("active");
        button.onclick = () => selectWorkspace(path);
        workspaceRecent.append(button);
      };
      for (const item of workspaceState.workspaces || []) {
        if (!item.path || known.has(item.path)) continue;
        known.add(item.path);
        addButton(
          item.path,
          item.name || baseName(item.path),
          item.path === workspaceState.cwd
        );
      }
      if (workspaceState.defaultCwd && !known.has(workspaceState.defaultCwd)) {
        addButton(
          workspaceState.defaultCwd,
          "当前目录",
          workspaceState.defaultCwd === workspaceState.cwd
        );
      }
      if (!workspaceRecent.children.length) {
        workspaceRecent.append(el("span", "session-empty", "暂无最近目录"));
      }
    }

    function renderSessions() {
      sessionList.replaceChildren();
      const items = workspaceState.sessions || [];
      if (!items.length) {
        sessionList.append(el("div", "session-empty", "这个目录还没有会话"));
        return;
      }
      for (const item of items) {
        const button = el("button", "session-item");
        button.type = "button";
        if (item.session_id === workspaceState.active) {
          button.classList.add("active");
        }
        const title = el(
          "span",
          "session-title",
          item.title || item.session_id || "未命名会话"
        );
        const time = el("span", "session-time", timeText(item.updated_at));
        button.append(title, time);
        button.onclick = () => openSession(item.session_id);
        sessionList.append(button);
      }
    }

    async function loadSessions(path) {
      sessionList.replaceChildren(el("div", "session-empty", "加载中…"));
      try {
        const data = await api(`/api/sessions?cwd=${encodeURIComponent(path)}`);
        workspaceState.cwd = data.cwd;
        workspaceState.sessions = data.sessions || [];
        workspacePath.textContent = data.cwd;
        workspaceInput.value = data.cwd;
        setWorkspaceLabel(data.cwd);
        localStorage.setItem("walle.cwd", data.cwd);
        renderSessions();
        renderWorkspaceRecent();
        return data;
      } catch (err) {
        sessionList.replaceChildren(
          el("div", "session-empty", err.message || "加载失败")
        );
        return null;
      }
    }

    async function selectWorkspace(path) {
      if (!path) return;
      const data = await loadSessions(path);
      if (!data) return;
      workspaceState.active = "";
      renderSessions();
    }

    async function openWorkspaceModal() {
      workspaceModal.hidden = false;
      workspacePath.textContent = workspaceState.cwd || "—";
      workspaceInput.value = workspaceState.cwd || "";
      try {
        const data = await api("/api/workspaces");
        workspaceState.defaultCwd = data.current || "";
        workspaceState.workspaces = data.workspaces || [];
        if (!workspaceState.cwd) workspaceState.cwd = workspaceState.defaultCwd;
        setWorkspaceLabel(workspaceState.cwd);
        renderWorkspaceRecent();
        if (workspaceState.cwd) await loadSessions(workspaceState.cwd);
      } catch (err) {
        renderWorkspaceRecent();
        sessionList.replaceChildren(
          el("div", "session-empty", err.message || "无法读取工作区")
        );
      }
    }

    function openSession(sessionId) {
      if (!workspaceState.cwd || !sessionId) return;
      workspaceState.active = sessionId;
      closeWorkspaceModal();
      connect(workspaceState.cwd, sessionId, true);
    }

    function startNewSession() {
      const cwd = workspaceState.cwd || workspaceState.defaultCwd;
      if (!cwd) return;
      workspaceState.active = "";
      closeWorkspaceModal();
      connect(cwd, newSessionId(), false);
    }

    function pendingApprovals() {
      const pending = [];
      for (const state of approvals.values()) {
        if (state.decision === null) pending.push(state);
      }
      return pending;
    }

    function refreshPending() {
      const pending = pendingApprovals();
      approvalBar.hidden = pending.length === 0;
      if (pending.length) {
        approvalText.textContent = `有 ${pending.length} 个工具等待审批`;
        document.title = "⚠ 待审批 · Walle";
      } else if (!WallePlugins.ownsPath(location.pathname)) {
        document.title = "Walle";
      }
    }

    function updateComposer() {
      const open = conversation.isOpen;
      send.disabled = busy || !open;
      send.textContent = busy
        ? (pendingApprovals().length ? "等待确认" : "生成中")
        : "发送";
      stop.hidden = !busy;
      stop.disabled = !open;
      stop.textContent = "停止";
    }

    function sendFrame(frame) {
      return conversation.send(frame);
    }

    function sendReply(id, data) {
      return sendFrame({ type: "reply", id, data });
    }

    function formatValue(value, depth = 0) {
      const pad = "  ".repeat(depth);
      if (typeof value === "string") return value;
      if (Array.isArray(value)) {
        if (!value.length) return "（空）";
        return value.map((item) => {
          if (item && typeof item === "object") {
            return `${pad}- ${formatValue(item, depth + 1).trimStart()}`;
          }
          return `${pad}- ${formatValue(item, depth + 1)}`;
        }).join("\n");
      }
      if (value && typeof value === "object") {
        const entries = Object.entries(value);
        if (!entries.length) return "（空）";
        return entries.map(([key, item]) => {
          if (item && typeof item === "object") {
            return `${pad}${key}:\n${formatValue(item, depth + 1)}`;
          }
          return `${pad}${key}: ${formatValue(item, depth + 1)}`;
        }).join("\n");
      }
      return String(value);
    }

    function valueText(value) {
      return formatValue(value);
    }

    function renderMarkdown(text) {
      if (!window.marked || !window.DOMPurify) return null;
      const html = window.marked.parse(text, { gfm: true, breaks: true });
      return window.DOMPurify.sanitize(html, {
        USE_PROFILES: { html: true, mathMl: true },
      });
    }

    let lastRender = 0;
    function renderAssistant(force = false) {
      if (!current) return;
      const now = performance.now();
      if (!force && now - lastRender < 80) return;
      lastRender = now;
      const html = renderMarkdown(current.text);
      if (html === null) {
        current.bubble.textContent = current.text;
        return;
      }
      current.bubble.innerHTML = html;
      for (const link of current.bubble.querySelectorAll("a")) {
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      }
    }

    function renderArgs(args) {
      const box = el("div", "args");
      const entries = Object.entries(args || {});
      if (!entries.length) {
        box.append(el("div", "call-hint", "（无参数）"));
        return box;
      }
      for (const [key, value] of entries) {
        const row = el("div", "arg");
        row.append(el("span", "arg-key", key), el("pre", "arg-val", valueText(value)));
        box.append(row);
      }
      return box;
    }

    function argsPreview(args) {
      const entries = Object.entries(args || {});
      if (!entries.length) return "无参数";
      const preferred = ["cmd", "command", "path", "query", "url", "name"];
      const pick = preferred
        .map((key) => [key, (args || {})[key]])
        .find(([, value]) => value !== undefined) || entries[0];
      const [key, value] = pick;
      const raw = valueText(value);
      const text = (raw || "").replace(/\s+/g, " ").trim();
      const limit = 90;
      return `${key}: ${text.length > limit ? text.slice(0, limit) + "…" : text}`;
    }

    function approvalCard(msg, data, tracked) {
      const card = el("div", "call");
      card.dataset.state = "pending";
      const head = el("div", "call-head");
      const ico = el("div", "call-ico", "🛡");
      const title = el("div", "call-title");
      title.append(
        el("div", "call-kicker", "工具审批"),
        el("div", "call-name", data.tool_name || "unknown")
      );
      // 待确认时右侧直接放按钮；决定后用状态徽章替换（更紧凑，无额外底栏）
      const pill = el("span", "pill pending", "待确认");
      pill.hidden = true;
      const actions = el("div", "actions");
      const deny = el("button", "ghost", "拒绝");
      const allow = el("button", "primary", "允许");
      actions.append(deny, allow);
      head.append(ico, title, actions, pill);

      const body = el("div", "call-body");
      // 参数默认折叠，只留一行预览 + 展开箭头，避免长命令把卡片撑满
      const argsBlock = el("details", "args-block");
      const argsSummary = el("summary", "");
      argsSummary.append(
        el("span", "args-label", "参数"),
        el("span", "args-preview", argsPreview(data.arguments))
      );
      argsBlock.append(argsSummary, renderArgs(data.arguments));
      body.append(argsBlock);
      card.append(head, body);

      const state = {
        card, body, pill, actions, allow, deny,
        tcId: data.tool_call_id || msg.id,
        tracked,  // 有 tool_start = 前台调用，可等 tool_result 回填结果
        decision: null,
        resultAdded: false,
      };
      approvals.set(state.tcId, state);
      refreshPending();

      const decide = (approved) => {
        const payload = approved ? { approved: true } : { approved: false };
        if (!sendReply(msg.id, payload)) {
          note("连接已断开，无法提交审批", true);
          return;
        }
        state.decision = approved ? "allowed" : "denied";
        card.dataset.state = state.decision;
        // 前台调用等 tool_result 回填结果；后台作业不推送工具事件，允许后直接收尾
        pill.className = "pill " + (!approved ? "denied" : state.tracked ? "running" : "ok");
        pill.textContent = !approved ? "已拒绝" : state.tracked ? "执行中" : "已允许";
        pill.hidden = false;
        actions.remove();
        if (approved && !state.tracked) approvals.delete(state.tcId);
        refreshPending();
        updateComposer();
      };
      allow.onclick = () => decide(true);
      deny.onclick = () => decide(false);
      return card;
    }

    function resultText(data) {
      const value = data.error != null ? data.error : data.result;
      let text = valueText(value);
      if (text == null) text = "";
      const LIMIT = 8000;
      return text.length > LIMIT ? text.slice(0, LIMIT) + "\n…（已截断）" : text;
    }

    function isCanvasResult(value) {
      return !!value && typeof value === "object"
        && value.type === "canvas" && !!value.canvas_id;
    }

    function attachResult(state, data) {
      if (state.resultAdded) return;
      state.resultAdded = true;
      const failed = !!data.error;
      if (!failed && isCanvasResult(data.result)) return;
      const details = el("details", "result");
      if (failed) details.open = true;
      const summary = el("summary", "");
      summary.append(el("span", "args-label", failed ? "执行结果（失败）" : "执行结果"));
      details.append(summary, el("pre", "", resultText(data)));
      state.body.append(details);
    }

    function finishApproval(data) {
      const state = approvals.get(data.tool_call_id);
      if (!state) return;
      if (state.decision === null) {
        // 兜底：服务端超时/通道异常时工具结果先到，按钮已不可用，直接给状态
        state.card.dataset.state = "failed";
        state.pill.className = "pill fail";
        state.pill.textContent = "未完成";
        state.pill.hidden = false;
        if (state.actions.isConnected) state.actions.remove();
      } else if (state.decision === "allowed") {
        const failed = !!data.error;
        state.card.dataset.state = failed ? "failed" : "done";
        state.pill.className = "pill " + (failed ? "fail" : "ok");
        state.pill.textContent = failed ? "失败" : "已完成";
        state.pill.hidden = false;
      }
      attachResult(state, data);
      approvals.delete(data.tool_call_id);
      refreshPending();
    }

    function inquiryCard(msg, data) {
      const card = el("div", "call");
      card.dataset.state = "pending";
      const head = el("div", "call-head");
      const title = el("div", "call-title");
      title.append(
        el("div", "call-kicker", "需要你的回答"),
        el("div", "call-name", "ask_user")
      );
      const pill = el("span", "pill pending", "待回答");
      head.append(el("div", "call-ico", "❓"), title, pill);
      const body = el("div", "call-body");
      body.append(el("div", "call-question", data.question || "需要你的回答"));
      const foot = el("div", "call-foot");
      const options = el("div", "options");
      const answer = el("input", "inquiry-input");
      answer.placeholder = "输入回答，Enter 提交";
      answer.setAttribute("aria-label", "回答");
      body.append(options, answer);
      const submit = el("button", "primary", "回答");
      foot.append(el("span", "call-hint", "回答后会继续执行"), submit);
      card.append(head, body, foot);

      const finish = (value) => {
        if (!sendReply(msg.id, { content: value })) {
          note("连接已断开，无法提交回答", true);
          return;
        }
        card.dataset.state = "done";
        pill.className = "pill ok";
        pill.textContent = "已回答";
        answer.disabled = true;
        submit.disabled = true;
        for (const btn of options.querySelectorAll("button")) btn.disabled = true;
      };
      for (const option of data.options || []) {
        const btn = el("button", "ghost", option);
        btn.onclick = () => finish(option);
        options.append(btn);
      }
      submit.onclick = () => {
        const value = answer.value.trim();
        if (value) finish(value);
      };
      answer.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          submit.click();
        }
      });
      return card;
    }

    function handleCall(msg) {
      const data = msg.data || {};
      let card;
      if (data.type === "approval") {
        const row = tools.get(data.tool_call_id);
        card = approvalCard(msg, data, !!row);
        // 审批卡本身即该工具的状态与结果载体，去掉重复的工具状态条
        if (row) {
          row.remove();
          tools.delete(data.tool_call_id);
        }
      } else if (data.type === "inquiry") {
        card = inquiryCard(msg, data);
      } else {
        sendReply(msg.id, {});
        note("未知交互类型，已自动回复");
        return;
      }
      log.append(card);
      scroll();
      updateComposer();
    }

    function showPreparing(toolName) {
      if (prepareRow) {
        prepareRow.querySelector(".tool-name").textContent = toolName || "tool";
        return;
      }
      prepareRow = el("div", "tool-row running");
      prepareRow.append(
        el("span", "tool-ico", "⚙"),
        el("span", "tool-name", toolName || "tool"),
        el("span", "tool-state", "生成参数…")
      );
      log.append(prepareRow);
      scroll();
    }

    function clearPreparing() {
      if (!prepareRow) return;
      prepareRow.remove();
      prepareRow = null;
    }

    function startTool(data) {
      clearPreparing();
      // 工具轮结束：后续文本（如最终回答）必须另起气泡，不能回填到工具前的回答里
      current = null;
      const row = el("div", "tool-row running");
      row.append(
        el("span", "tool-ico", "⚙"),
        el("span", "tool-name", data.tool_name || "tool"),
        el("span", "tool-state", "执行中")
      );
      log.append(row);
      tools.set(data.tool_call_id || data.tool_name, row);
      scroll();
    }

    function finishTool(data) {
      const row = tools.get(data.tool_call_id);
      const hasCard = approvals.has(data.tool_call_id);
      if (row) {
        row.classList.remove("running");
        row.classList.add(data.error ? "fail" : "ok");
        row.querySelector(".tool-state").textContent = data.error ? "失败" : "完成";
      }
      finishApproval(data);
      const result = data.result || {};
      if (!data.error && WallePlugins.toolResult(data)) {
        tools.delete(data.tool_call_id);
      } else if (!data.error && isCanvasResult(result)) {
        // 保留调用状态条：即使无需审批，也要能看到 canvas 被调用
        tools.delete(data.tool_call_id);
        const state = canvasCard({ ...result, session_id: data.session_id });
        // 面板已打开时：同画布版本更新直接刷新，新画布也直接切过去
        if (!canvasPanel.hidden) openCanvas(state);
      } else if (data.error && !hasCard) {
        log.append(el("div", "tool-error", data.error));
      }
      scroll();
    }

    function closePending(reason) {
      clearPreparing();
      // run 已结束：未答复的审批不再可操作，只留状态徽章
      for (const state of approvals.values()) {
        state.pill.hidden = false;
        if (state.decision === "allowed" && !reason) {
          state.card.dataset.state = "done";
          state.pill.className = "pill ok";
          state.pill.textContent = "已允许";
          continue;
        }
        state.card.dataset.state = "failed";
        state.pill.className = "pill fail";
        state.pill.textContent = state.decision === "allowed" ? "已中断" : "已失效";
        if (state.actions.isConnected) state.actions.remove();
      }
      approvals.clear();
      refreshPending();
      for (const row of tools.values()) {
        if (!row.classList.contains("running")) continue;
        row.classList.remove("running");
        row.classList.add("fail");
        row.querySelector(".tool-state").textContent = "已中断";
      }
      tools.clear();
    }

    function canvasSrc(state) {
      const pluginUrl = WallePlugins.canvasUrl(state);
      if (pluginUrl) return pluginUrl;
      const id = encodeURIComponent(state.id);
      const session = encodeURIComponent(state.sessionId);
      return `/canvas/${session}/${id}?v=${state.version}`;
    }

    function canvasCard(data) {
      const key = `${data.course_id || ""}:${data.canvas_id}`;
      const existing = canvases.get(key);
      if (existing) {
        if (data.title) existing.title = data.title;
        if (data.version) existing.version = data.version;
        existing.name.textContent = existing.title;
        if (shownCanvas === existing) canvasName.textContent = existing.title;
        latestCanvas = existing;
        return existing;
      }
      const card = el("div", "canvas-card");
      const title = el("div", "canvas-title");
      const name = el("div", "canvas-name", data.title || "画布");
      title.append(el("div", "canvas-kicker", "画布"), name);
      const open = el("button", "ghost canvas-open", "打开画布");
      card.append(title, open);
      const state = {
        id: data.canvas_id,
        sessionId: data.session_id || "",
        courseId: data.course_id || "",
        title: data.title || "画布",
        version: data.version || 0,
        card, name, open,
      };
      card.onclick = () => toggleCanvas(state);
      open.onclick = (event) => {
        event.stopPropagation();
        toggleCanvas(state);
      };
      canvases.set(key, state);
      latestCanvas = state;
      log.append(card);
      scroll();
      return state;
    }

    function toggleCanvas(state) {
      if (!canvasPanel.hidden && shownCanvas === state && !canvasPanel.classList.contains("full")) {
        closeCanvas();
      } else {
        openCanvas(state);
      }
    }

    function syncCanvasButtons() {
      const open = !canvasPanel.hidden && !canvasPanel.classList.contains("full");
      for (const state of canvases.values()) {
        if (!state.open) continue;
        state.open.textContent = open && shownCanvas === state ? "收起画布" : "打开画布";
      }
      canvasLatest.textContent = open ? "收起" : "画布";
    }

    function syncSplitter() {
      canvasSplitter.hidden = canvasPanel.hidden || canvasPanel.classList.contains("full");
    }

    function setCanvasFull(full) {
      canvasPanel.classList.toggle("full", full);
      document.body.classList.toggle("canvas-full", full);
      canvasFull.textContent = full ? "还原" : "放大";
      syncSplitter();
      syncCanvasButtons();
    }

    function openCanvas(state) {
      shownCanvas = state;
      canvasPanel.hidden = false;
      canvasEmpty.hidden = true;
      canvasFrame.hidden = false;
      canvasName.textContent = state.title;
      document.body.classList.add("canvas-open");
      const src = canvasSrc(state);
      if (canvasFrame.dataset.src !== src) {
        canvasFrame.dataset.src = src;
        canvasFrame.src = src;
      }
      syncSplitter();
      syncCanvasButtons();
    }

    function openEmptyCanvas() {
      shownCanvas = null;
      canvasPanel.hidden = false;
      canvasEmpty.hidden = false;
      canvasFrame.hidden = true;
      canvasName.textContent = "尚未创建";
      document.body.classList.add("canvas-open");
      syncSplitter();
      syncCanvasButtons();
    }

    function closeCanvas() {
      shownCanvas = null;
      if (canvasPanel.classList.contains("full")) setCanvasFull(false);
      canvasPanel.hidden = true;
      document.body.classList.remove("canvas-open");
      syncSplitter();
      syncCanvasButtons();
    }

    function handle(msg) {
      if (msg.type === "call") {
        handleCall(msg);
        return;
      }
      if (msg.type === "welcome") {
        setStatus("已连接", "on");
        renderHistory(msg.history);
        updateComposer();
        return;
      }
      if (msg.type === "error") {
        const text = msg.message || "连接错误";
        if (/不存在|非法|不是目录|需要 session/.test(text) && !/agent 未启动|agent 未响应/.test(text)) {
          conversation.suppressReconnect();
        }
        note(text, true);
        busy = false;
        closePending("error");
        updateComposer();
        return;
      }
      if (msg.type !== "notify") return;

      const data = msg.data || {};
      if (data.type === "error" && data.code === "session_taken_over") {
        // 同一会话在别的标签页/窗口打开：旧连接会被服务端踢下线。
        // 此时若继续自动重连，会和新连接互相抢会话，形成无限重连。
        conversation.suppressReconnect("已在其他页面打开");
        note("会话已在其他页面打开，本页已停止重连", true);
        busy = false;
        closePending("session_taken_over");
        updateComposer();
        return;
      }
      if (data.type === "delta") {
        if (!current) {
          current = add("assistant", "");
          lastRender = 0;
        }
        current.text += data.delta || "";
        renderAssistant();
        scroll();
      } else if (data.type === "delta_end") {
        clearPreparing();
        renderAssistant(true);
        current = null;
        busy = false;
        closePending(data.reason);
        updateComposer();
        if (data.reason) note("结束：" + data.reason, data.reason !== "max_turns");
      } else if (data.type === "tool_prepare") {
        showPreparing(data.tool_name);
      } else if (data.type === "tool_start") {
        startTool(data);
      } else if (data.type === "tool_result") {
        finishTool(data);
      } else if (data.type === "error") {
        note("错误：" + (data.message || data.code || "unknown"), true);
        busy = false;
        closePending("error");
        updateComposer();
      }
    }

    function connect(cwd, sessionId, attach) {
      const targetSession = sessionId || newSessionId();
      conversation.connect(cwd, targetSession, attach);
    }

    function submit() {
      const text = input.value.trim();
      if (!text || busy || !conversation.isOpen) return;
      add("user", text);
      input.value = "";
      input.style.height = "auto";
      current = null;
      busy = true;
      updateComposer();
      conversation.sendInput(text);
    }

    function cancel() {
      if (!busy || !conversation.cancel()) return;
      stop.disabled = true;
      stop.textContent = "停止中…";
      note("正在停止当前执行…");
    }

    send.addEventListener("click", submit);
    stop.addEventListener("click", cancel);
    workspaceButton.addEventListener("click", openWorkspaceModal);
    agentModeButton.addEventListener("click", () => {
      applyAgentMode(agentMode ? "" : "learning", true);
    });
    workspaceClose.addEventListener("click", closeWorkspaceModal);
    workspaceModal.addEventListener("click", (event) => {
      if (event.target === workspaceModal) closeWorkspaceModal();
    });
    workspaceForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const path = workspaceInput.value.trim();
      if (path) await selectWorkspace(path);
    });
    sessionNew.addEventListener("click", startNewSession);
    approvalJump.addEventListener("click", () => {
      const first = pendingApprovals()[0];
      if (first) first.card.scrollIntoView({ behavior: "smooth", block: "end" });
    });
    canvasClose.addEventListener("click", closeCanvas);
    canvasLatest.addEventListener("click", () => {
      if (!canvasPanel.hidden) {
        closeCanvas();
        return;
      }
      if (latestCanvas) openCanvas(latestCanvas);
      else openEmptyCanvas();
    });
    canvasFull.addEventListener("click", () => {
      setCanvasFull(!canvasPanel.classList.contains("full"));
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (!workspaceModal.hidden) {
        closeWorkspaceModal();
        return;
      }
      if (canvasPanel.hidden) return;
      if (canvasPanel.classList.contains("full")) setCanvasFull(false);
      else closeCanvas();
    });
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        submit();
      }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });
    for (const hint of document.querySelectorAll("[data-prompt]")) {
      hint.addEventListener("click", () => {
        input.value = hint.dataset.prompt || "";
        input.dispatchEvent(new Event("input"));
        input.focus();
      });
    }

    let dragStartX = 0;
    let dragStartWidth = 0;
    let dragMaxWidth = 0;
    canvasSplitter.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      const shell = document.querySelector(".shell").getBoundingClientRect();
      dragStartX = event.clientX;
      dragStartWidth = canvasPanel.getBoundingClientRect().width;
      dragMaxWidth = shell.width - 24 - canvasSplitter.offsetWidth - 360;
      canvasSplitter.setPointerCapture(event.pointerId);
      document.body.classList.add("resizing");
      event.preventDefault();
    });
    canvasSplitter.addEventListener("pointermove", (event) => {
      if (!document.body.classList.contains("resizing")) return;
      const width = Math.max(
        320,
        Math.min(dragStartWidth + dragStartX - event.clientX, dragMaxWidth)
      );
      document.documentElement.style.setProperty("--canvas-width", `${Math.round(width)}px`);
    });
    const finishResize = (event) => {
      if (!document.body.classList.contains("resizing")) return;
      document.body.classList.remove("resizing");
      if (canvasSplitter.hasPointerCapture(event.pointerId)) {
        canvasSplitter.releasePointerCapture(event.pointerId);
      }
      localStorage.setItem(
        "walle.canvasWidth",
        String(Math.round(canvasPanel.getBoundingClientRect().width))
      );
    };
    canvasSplitter.addEventListener("pointerup", finishResize);
    canvasSplitter.addEventListener("pointercancel", finishResize);
    canvasSplitter.addEventListener("dblclick", () => {
      document.documentElement.style.removeProperty("--canvas-width");
      localStorage.removeItem("walle.canvasWidth");
    });

    async function init() {
      const params = new URLSearchParams(location.search);
      const querySession = params.get("session") || "";
      const queryCwd = params.get("cwd") || "";
      const queryAgent = params.get("agent") || "";
      const queryPrompt = params.get("prompt") || "";
      let cwd = queryCwd || localStorage.getItem("walle.cwd") || "";
      const savedSession = localStorage.getItem("walle.session") || "";
      if (queryAgent === "learning" || queryAgent === "default") {
        agentMode = queryAgent === "learning" ? "learning" : "";
      }
      applyAgentMode(agentMode, false);
      try {
        const data = await api("/api/workspaces");
        workspaceState.defaultCwd = data.current || "";
        workspaceState.workspaces = data.workspaces || [];
        cwd = cwd || workspaceState.defaultCwd;
      } catch (err) {
        console.error(err);
      }
      WallePlugins.setContext({
        api,
        renderMarkdown,
        conversation,
        router,
        input,
        log,
        el,
        scroll,
        setPrompt: (prompt) => {
          input.value = prompt;
          input.dispatchEvent(new Event("input"));
          input.focus();
        },
      });
      await WallePlugins.start();
      const targetSession = querySession || savedSession;
      if (targetSession) connect(cwd, targetSession, true);
      else connect(cwd, newSessionId(), false);
      router.start();
      router.render();
      if (queryPrompt) {
        input.value = queryPrompt;
        input.dispatchEvent(new Event("input"));
        input.focus();
      }
      // 课程深链的 ?lesson= 要保留；对话页的临时参数用完即清理。
      if (params.toString() && !WallePlugins.ownsPath(location.pathname)) {
        try { history.replaceState(null, "", location.pathname); } catch (err) { console.error(err); }
      }
    }

    init();
    updateComposer();
    refreshPending();
  </script>
</body>
</html>
