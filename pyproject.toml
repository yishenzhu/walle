[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "walle"
version = "0.1.0"
description = "An AI agent framework"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "mcp>=1.0",
    "httpx>=0.27",
    "python-frontmatter>=1.0",
    "pyflakes>=3.0",
    "jupyter_client>=8.0",
    "ipykernel>=7.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "opentelemetry-instrumentation-openai>=0.40b0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["walle*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]
bench = [
    "tau-bench @ git+https://github.com/sierra-research/tau-bench.git",
    "litellm>=1.41.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".."]
testpaths = ["tests"]
