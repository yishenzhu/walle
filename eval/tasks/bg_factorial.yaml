name: bg_factorial
domain: background
prompt: '用 background 工具把 bash 工具放到后台执行：background 的 tool_name 传 "bash"，args 传 {"cmd": "python3 -c \"import math; print(math.factorial(10))\""}。然后用 job_result 工具取回结果。最终输出最终数字。'
tools:
  - background
  - job_result
  - bash
max_turns: 8
ground_truth:
  type: numeric
  value: "3628800"
  tool_trace:
    - background
    - job_result
