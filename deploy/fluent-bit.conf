[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /fluent-bit/etc/walle-parsers.conf

[INPUT]
    Name      tail
    Path      /walle/logs/app.log
    Tag       walle.app
    Path_Key  stream
    Parser    app

[INPUT]
    Name      tail
    Path      /walle/logs/access.log
    Tag       walle.access
    Path_Key  stream

[INPUT]
    Name      tail
    Path      /walle/logs/audit.jsonl
    Tag       walle.audit
    Path_Key  stream
    Parser    walle_json

[OUTPUT]
    Name        stdout
    Match       walle.*
    Format      json_lines
