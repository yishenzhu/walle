[PARSER]
    Name   walle_json
    Format json

[PARSER]
    Name        app
    Format      regex
    Regex       ^(?<ts>[^|]+)\|(?<level>[^|]+)\|trace_id=(?<trace_id>\S+) span_id=(?<span_id>[^|]*)\|(?<message>[\s\S]*)$
    Time_Key    ts
    Time_Format %Y-%m-%d %H:%M:%S,%L
    Time_Keep   On

[MULTILINE_PARSER]
    Name          app_multiline
    Type          regex
    Flush_Timeout 1000
    Rule          "start_state"  "/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}\|/"       "cont"
    Rule          "cont"         "/^(?!\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}\|)/"  "cont"
