name: walle

services:
  agent:
    build:
      context: .
    image: walle:0.1.0
    command: ["python", "-m", "walle.main"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      WALLE_CONF: conf.prod.yaml
      WALLE_HOME: /var/lib/walle
      WALLE_TEMPLATES: /opt/walle/templates
      WALLE_INIT: "1"
      WALLE_LOG_FILE: "1"
      WALLE_LOG_STDOUT: "0"
      WALLE_AUDIT: "1"
      WALLE_BIND_HOST: "0.0.0.0"
      WALLE_ALLOW_PRIVATE_UPSTREAM: "${WALLE_ALLOW_PRIVATE_UPSTREAM:-0}"
      HOME: /tmp
    volumes:
      - walle-home:/var/lib/walle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8899), 2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
    image: walle:0.1.0
    command: ["python", "-m", "walle.channel.web", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      WALLE_HOME: /var/lib/walle
      WALLE_TEMPLATES: /opt/walle/templates
      WALLE_ACCESS_LOG: "1"
      WALLE_LOG_STDOUT: "1"
      WALLE_LOG_FILE: "0"
      WALLE_AGENT_HOST: agent
      WALLE_ALLOW_PRIVATE_UPSTREAM: "${WALLE_ALLOW_PRIVATE_UPSTREAM:-0}"
      HOME: /tmp
    volumes:
      - walle-home:/var/lib/walle
    read_only: true
    tmpfs:
      - /tmp:size=256m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      agent:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  logs:
    image: docker.m.daocloud.io/fluent/fluent-bit:3.1
    command: ["-c", "/fluent-bit/etc/walle.conf"]
    restart: unless-stopped
    volumes:
      - walle-home:/walle:ro
      - ./deploy/fluent-bit.conf:/fluent-bit/etc/walle.conf:ro
      - ./deploy/fluent-bit-parsers.conf:/fluent-bit/etc/walle-parsers.conf:ro
    depends_on:
      agent:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    image: walle-caddy:0.1.0
    restart: unless-stopped
    environment:
      WALLE_SITE: "${WALLE_SITE:-:80}"
      WALLE_RATE_EVENTS: "${WALLE_RATE_EVENTS:-120}"
      WALLE_RATE_WINDOW: "${WALLE_RATE_WINDOW:-1m}"
    ports:
      - "${WALLE_HTTP_PORT:-80}:80"
      - "${WALLE_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: walle:0.1.0
    entrypoint: ["/bin/sh", "/opt/walle/deploy/backup-loop.sh"]
    restart: unless-stopped
    user: "0:0"
    environment:
      BACKUP_INTERVAL: "${WALLE_BACKUP_INTERVAL:-86400}"
      BACKUP_KEEP: "${WALLE_BACKUP_KEEP:-7}"
    volumes:
      - walle-home:/data:ro
      - ./backups:/backup
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  walle-home:
  caddy-data:
  caddy-config:
